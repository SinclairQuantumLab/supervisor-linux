; Supervisor config file for the test app at ./tests/supervisor-test-child.py.
; The app opens a GUI and writes separate stdout and stderr messages every second.

[program:supervisor-test-child]
command="%(ENV_HOME)s/Projects/supervisor/.venv/bin/python" -u "%(ENV_HOME)s/Projects/supervisor/tests/supervisor-test-child.py" --interval-seconds 1
directory=%(ENV_HOME)s/Projects/supervisor
process_name=%(program_name)s
autostart=false
startsecs=2
startretries=0
autorestart=false
stdout_logfile=%(here)s/logs/%(program_name)s_out.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
stderr_logfile=%(here)s/logs/%(program_name)s_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=2
